<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapshot Export - GRIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .nav-item {
            color: #cbd5e1;
        }

        .nav-item:hover {
            background-color: #1e293b;
            color: white;
        }

        .nav-item.active {
            background-color: #1e293b;
            color: white;
        }
    </style>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col flex-shrink-0 transition-all duration-300">
        <div class="h-16 flex items-center px-6 border-b border-slate-800">
            <div
                class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center mr-3 font-bold text-white shrink-0">
                G</div>
            <span class="text-lg font-bold tracking-wide">GRIP</span>
        </div>
        <div class="p-4 flex-1 overflow-y-auto">
            <nav class="space-y-1">
                <a href="dashboard.html"
                    class="flex items-center px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
                    <span class="mr-3 text-xl">📊</span> Dashboard
                </a>
                <a href="entity-search.html"
                    class="flex items-center px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
                    <span class="mr-3 text-xl">🔍</span> Entity Search
                </a>
                <a href="lineage-overview.html"
                    class="flex items-center px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
                    <span class="mr-3 text-xl">🌲</span> Lineage Mapping
                </a>
                <a href="task-queue.html"
                    class="flex items-center px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
                    <span class="mr-3 text-xl">📋</span> Task Queue
                </a>
                <div class="pt-4 pb-2">
                    <p class="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Configuration</p>
                </div>
                <a href="source-detail.html"
                    class="flex items-center px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
                    <span class="mr-3 text-xl">💚</span> Sources
                </a>
                <a href="dq-rules.html"
                    class="flex items-center px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
                    <span class="mr-3 text-xl">✅</span> DQ Rules
                </a>
                <a href="er-rules.html"
                    class="flex items-center px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
                    <span class="mr-3 text-xl">🔗</span> ER Rules
                </a>
                <a href="survivorship-rules.html"
                    class="flex items-center px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
                    <span class="mr-3 text-xl">🏆</span> Survivorship
                </a>
                <div class="pt-4 pb-2">
                    <p class="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest">System</p>
                </div>
                <a href="audit-log.html"
                    class="flex items-center px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
                    <span class="mr-3 text-xl">📜</span> Audit Log
                </a>
                <a href="user-management.html"
                    class="flex items-center px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
                    <span class="mr-3 text-xl">👤</span> Users
                </a>
            </nav>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-8 text-slate-900">
            <h1 class="text-xl font-bold">Export Snapshot</h1>
            <a href="entity-search.html" class="text-sm text-gray-400 hover:text-gray-600">Cancel</a>
        </header>

        <main class="flex-1 overflow-y-auto p-8 bg-slate-50">
            <div class="max-w-3xl mx-auto space-y-6">
                <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-10">
                    <h2 class="text-2xl font-black text-slate-900 mb-2">Configure Data Export</h2>
                    <p class="text-sm text-gray-500 mb-10">Select your format and scope for the current search results
                        (97 entities).</p>

                    <div class="space-y-8">
                        <div>
                            <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-4">Export
                                Format</label>
                            <div class="grid grid-cols-3 gap-4">
                                <button
                                    class="p-4 border-2 border-blue-500 bg-blue-50 rounded-2xl text-center transition-all">
                                    <span class="text-2xl block mb-1">📄</span>
                                    <span class="text-xs font-bold text-blue-700">JSON (Raw)</span>
                                </button>
                                <button
                                    class="p-4 border border-gray-200 hover:border-blue-300 rounded-2xl text-center transition-all">
                                    <span class="text-2xl block mb-1">📊</span>
                                    <span class="text-xs font-bold text-gray-600">CSV (Excel)</span>
                                </button>
                                <button
                                    class="p-4 border border-gray-200 hover:border-blue-300 rounded-2xl text-center transition-all">
                                    <span class="text-2xl block mb-1">🏗️</span>
                                    <span class="text-xs font-bold text-gray-600">Parquet</span>
                                </button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-4">Data
                                Scope</label>
                            <div class="space-y-4">
                                <label
                                    class="flex items-center p-4 border border-gray-100 rounded-2xl bg-gray-50 cursor-pointer">
                                    <input type="radio" name="scope" class="w-4 h-4 text-blue-600" checked>
                                    <div class="ml-4">
                                        <p class="text-sm font-bold text-slate-900">Master Record (Golden Record)</p>
                                        <p class="text-[10px] text-gray-500">Only the final calculated values for each
                                            entity.</p>
                                    </div>
                                </label>
                                <label
                                    class="flex items-center p-4 border border-gray-100 rounded-2xl hover:bg-gray-50 cursor-pointer transition-colors">
                                    <input type="radio" name="scope" class="w-4 h-4 text-blue-600">
                                    <div class="ml-4">
                                        <p class="text-sm font-bold text-slate-900">Full Lineage (All Sources)</p>
                                        <p class="text-[10px] text-gray-500">Includes every contributing registry record
                                            and audit trail.</p>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <button
                            class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black text-lg shadow-lg hover:bg-blue-700 transform hover:-translate-y-1 transition-all">Generate
                            & Download</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
