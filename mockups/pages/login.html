<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GRIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Brand Header -->
        <div class="bg-blue-600 p-8 text-center">
            <div
                class="mx-auto bg-white/20 w-16 h-16 rounded-xl flex items-center justify-center backdrop-blur-sm mb-4">
                <span class="text-3xl font-bold text-white">G</span>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">GRIP</h1>
            <p class="text-blue-100 text-sm mt-1">Registry Intelligence Platform</p>
        </div>

        <!-- Login Form -->
        <div class="p-8">
            <h2 class="text-xl font-bold text-gray-900 text-center mb-8">Welcome Back</h2>

            <form action="dashboard.html" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email"
                        class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        placeholder="you@company.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password"
                        class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        placeholder="••••••••">
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox"
                            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-600">Remember me</label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-blue-600 hover:text-blue-500">Forgot password?</a>
                    </div>
                </div>

                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Sign in
                </button>
            </form>

            <div class="mt-8">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">Or continue with</span>
                    </div>
                </div>

                <div class="mt-6">
                    <button type="button"
                        class="w-full flex items-center justify-center px-4 py-3 border border-gray-300 shadow-sm text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        <svg class="h-5 w-5 mr-3" aria-hidden="true" viewBox="0 0 24 24">
                            <path
                                d="M12.0003 20.45c4.6667 0 8.45-3.7833 8.45-8.45 0-4.6667-3.7833-8.45-8.45-8.45-4.6667 0-8.45 3.7833-8.45 8.45 0 4.6667 3.7833 8.45 8.45 8.45z"
                                fill="#fff" />
                            <path
                                d="M20.45 12c0-.5833-.05-1.15-.15-1.7H12v3.2h4.75c-.2 1.1-.85 2.05-1.8 2.7v2.25h2.9c1.7-1.55 2.6-3.85 2.6-6.45z"
                                fill="#4285F4" />
                            <path
                                d="M12 20.45c2.3 0 4.25-.75 5.65-2.05l-2.9-2.25c-.75.5-1.7.8-2.75.8-2.15 0-3.95-1.45-4.6-3.4H4.4v2.15c1.4 2.8 4.3 4.75 7.6 4.75z"
                                fill="#34A853" />
                            <path
                                d="M7.4 13.55c-.15-.45-.25-.95-.25-1.55 0-.6.1-1.1.25-1.55V8.3H4.4c-.65 1.25-1 2.65-1 4.15 0 1.5.35 2.9 1 4.15l3-2.3z"
                                fill="#FBBC05" />
                            <path
                                d="M12 6.9c1.25 0 2.35.45 3.25 1.3l2.45-2.45C16.25 4.4 14.3 3.55 12 3.55c-3.3 0-6.2 1.95-7.6 4.75l3 2.3c.65-1.95 2.45-3.4 4.6-3.4z"
                                fill="#EA4335" />
                        </svg>
                        Sign in with Google
                    </button>
                </div>
            </div>
        </div>
        <div class="bg-gray-50 px-8 py-4 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-500">Don't have an account? <a href="#"
                    class="text-blue-600 font-medium hover:underline">Contact Administrator</a></p>
        </div>
    </div>

</body>

</html>
